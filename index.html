<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>몽당분필 회원 앱</title>
<link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1bM6Cj0QHvaLXWGHFga9GOQZZFH9oQAL5=s192?type=.png">
<link rel="apple-touch-icon" sizes="180x180" href="https://lh3.googleusercontent.com/d/1bM6Cj0QHvaLXWGHFga9GOQZZFH9oQAL5=s180?type=.png">
<meta name="apple-mobile-web-app-title" content="몽당분필">
<meta name="application-name" content="몽당분필">
<meta name="theme-color" content="#FFF9EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">


<style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;background:#f5f7f8;color:#1d2329;line-height:1.55}
.w{max-width:460px;margin:0 auto;padding:28px 18px 40px}.logo{display:block;width:132px;height:132px;margin:0 auto 10px;border-radius:30px;box-shadow:0 4px 18px rgba(0,0,0,.12)}
h1{font-size:21px;text-align:center;margin:8px 0 4px}.sub{text-align:center;color:#66707a;font-size:14px;margin:0 0 22px}
.card{background:#fff;border:1px solid #e3e7eb;border-radius:16px;padding:16px 18px;margin-top:14px}
ol{margin:0;padding-left:22px}li{margin:8px 0}b.k{color:#0a6fab}
.btn{display:block;text-align:center;text-decoration:none;font-weight:700;border-radius:12px;padding:14px;margin-top:12px;font-size:16px}
.g{background:#5a9f43;color:#fff}.b{background:#0b8fd9;color:#fff}.o{background:#fff;color:#1d2329;border:1px solid #e3e7eb}
.warn{background:#fff7e6;border:1px solid #f5d79e;border-radius:12px;padding:10px 12px;font-size:14px;margin-top:14px}.muted{color:#66707a;font-size:13px;text-align:center;margin-top:18px}</style></head><body><div class="w">
<img class="logo" src="https://lh3.googleusercontent.com/d/1bM6Cj0QHvaLXWGHFga9GOQZZFH9oQAL5=s192?type=.png" alt="몽당분필 회원 앱">

<h1>몽당분필 회원 앱</h1><p class="sub">휴대폰 홈 화면에 설치해서 쓰세요</p>
<button class="btn b" id="inst" style="width:100%;border:0;font-size:18px;padding:16px">📲 홈 화면에 바로 설치하기</button>
<p id="instMsg" style="display:none;text-align:center;font-size:14px;color:#5a9f43;margin:8px 0 0"></p>
<a class="btn o" href="iphone.html">🍎 아이폰 설치 안내</a>
<a class="btn o" href="android.html">🤖 안드로이드 설치 안내</a>
<a class="btn g" href="app.html">앱 바로 열기</a>
<style>
#ah{position:fixed;inset:0;z-index:50;display:none}#ah .dim{position:absolute;inset:0;background:rgba(0,0,0,.55)}
#ah .box{position:absolute;left:14px;right:14px;top:96px;background:#fff;border-radius:18px;padding:18px 18px 14px;box-shadow:0 10px 30px rgba(0,0,0,.3);text-align:center}
#ah .st{font-size:13px;color:#2b7fb8;font-weight:700}#ah .tx{font-size:19px;font-weight:800;margin:6px 0 4px;line-height:1.4}#ah .sm{font-size:14px;color:#7A7468}
#ah .nav{display:flex;gap:8px;margin-top:14px}#ah .nav a{flex:1;margin:0;padding:12px;font-size:15px}
#ah .arw{position:absolute;font-size:46px;line-height:1;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5);animation:abu 1s ease-in-out infinite}
#ah .arw.t{top:4px;right:10px}#ah .arw.b{bottom:18px;right:24px;animation:abd 1s ease-in-out infinite}#ah.bot .box{top:auto;bottom:110px}
@keyframes abu{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes abd{0%,100%{transform:translateY(0)}50%{transform:translateY(10px)}}
</style>
<div id="ah"><div class="dim"></div><div class="arw t" id="ahT">⬆︎</div><div class="arw b" id="ahB">⬇︎</div>
<div class="box"><div class="st" id="ahSt"></div><div class="tx" id="ahTx"></div><div class="sm" id="ahSm"></div>
<div class="nav"><a class="btn o" href="#" id="ahPrev">이전</a><a class="btn b" href="#" id="ahNext">다음</a></div></div></div>
<script>(function(){
var dp=null,ua=navigator.userAgent,b=document.getElementById('inst'),msg=document.getElementById('instMsg'),ov=document.getElementById('ah');
var inApp=/KAKAOTALK|NAVER|Instagram|FBAN|FBAV|Line\/|DaumApps|everytimeApp/i.test(ua);
var sam=/SamsungBrowser/i.test(ua),ios=/iPhone|iPad|iPod/.test(ua);
if(inApp){b.style.display='none';return;}
if(ios){b.textContent='🍎 아이폰은 여기를 눌러 설치 안내 보기';b.onclick=function(){location.href='iphone.html';};return;}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e;});
window.addEventListener('appinstalled',function(){msg.style.display='block';msg.textContent='설치됐어요! 홈 화면의 몽당분필 아이콘으로 열어 주세요.';});
var S=sam?[
 ['화면 아래의 <b>≡ 메뉴</b>를 누르세요','가로줄 세 개 모양이에요.',1],
 ['<b>\'현재 페이지 추가\'</b>를 누르세요','안 보이면 메뉴를 옆으로 넘겨 찾아보세요.',0],
 ['<b>\'홈 화면\'</b>을 고르고 <b>\'추가\'</b>를 누르면 끝!','홈 화면에 몽당분필 아이콘이 생겨요.',0]
]:[
 ['오른쪽 위 <b>⋮ 메뉴</b>를 누르세요','점 세 개 모양이에요.',2],
 ['<b>\'홈 화면에 추가\'</b> 또는 <b>\'앱 설치\'</b>를 누르세요','목록을 내리면 보여요.',0],
 ['<b>\'설치\'</b>(또는 \'추가\')를 누르면 끝!','홈 화면에 몽당분필 아이콘이 생겨요.',0]
],i=0;
function q(x){return document.getElementById(x);}
function show(n){i=Math.max(0,Math.min(S.length-1,n));q('ahSt').textContent=(i+1)+' / '+S.length+' 단계';q('ahTx').innerHTML=S[i][0];q('ahSm').innerHTML=S[i][1];
 q('ahT').style.display=S[i][2]===2?'block':'none';q('ahB').style.display=S[i][2]===1?'block':'none';ov.className=S[i][2]===1?'bot':'';
 q('ahPrev').style.visibility=i?'visible':'hidden';q('ahNext').textContent=i<S.length-1?'다음':'알겠어요';ov.style.display='block';}
q('ahNext').onclick=function(e){e.preventDefault();if(i<S.length-1)show(i+1);else ov.style.display='none';};
q('ahPrev').onclick=function(e){e.preventDefault();show(i-1);};ov.querySelector('.dim').onclick=function(){ov.style.display='none';};
b.onclick=function(){if(dp){dp.prompt();dp.userChoice.then(function(c){if(c.outcome==='accepted'){msg.style.display='block';msg.textContent='설치 중이에요. 잠시 후 홈 화면을 확인해 주세요.';}dp=null;});}else{show(0);}};
})();</script>
</div></body></html>
