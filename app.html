<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>몽당분필</title>
<link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1bM6Cj0QHvaLXWGHFga9GOQZZFH9oQAL5=s192?type=.png">
<link rel="apple-touch-icon" sizes="180x180" href="https://lh3.googleusercontent.com/d/1bM6Cj0QHvaLXWGHFga9GOQZZFH9oQAL5=s180?type=.png">
<meta name="apple-mobile-web-app-title" content="몽당분필">
<meta name="application-name" content="몽당분필">
<meta name="theme-color" content="#FFF9EC">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>html,body{margin:0;height:100%;background:#FFF9EC;overflow:hidden}
#f{position:fixed;top:env(safe-area-inset-top);left:0;right:0;bottom:0;width:100%;height:calc(100% - env(safe-area-inset-top));border:0;background:#FFF9EC}
#fb{position:fixed;left:0;right:0;bottom:24px;text-align:center;font:14px -apple-system,sans-serif;display:none}#fb a{color:#2b7fb8}</style>
</head><body>
<iframe id="f" src="https://script.google.com/macros/s/AKfycbzLD7YevNBIjI_-imcGQsbgu820tQwLZt9r53gs3SmZu4U-r8IVYDIvu3eJ0fWWu9aw/exec" allow="clipboard-write; camera" title="몽당분필"></iframe>
<div id="fb">화면이 안 나오면 <a href="https://script.google.com/macros/s/AKfycbzLD7YevNBIjI_-imcGQsbgu820tQwLZt9r53gs3SmZu4U-r8IVYDIvu3eJ0fWWu9aw/exec">여기를 눌러 열기</a></div>
<script>setTimeout(function(){document.getElementById('fb').style.display='block';setTimeout(function(){document.getElementById('fb').style.display='none';},6000);},12000);</script>
</body></html>
