<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>문자 보내기</title><meta name="robots" content="noindex">
<style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#FFF9EC;color:#2F2F2F}
.w{max-width:460px;margin:0 auto;padding:28px 18px}h1{font-size:20px;margin:0 0 6px}p{color:#7A7468;font-size:14px;margin:0 0 14px}
a.b{display:block;text-align:center;text-decoration:none;font-weight:700;border-radius:12px;padding:16px;font-size:17px;background:#2b7fb8;color:#fff;margin-top:10px}
pre{white-space:pre-wrap;background:#fff;border:1px solid #EFE7D6;border-radius:12px;padding:12px;font:14px/1.5 inherit}</style></head><body><div class="w">
<h1 id="t">문자 앱을 여는 중…</h1><p id="s">안 열리면 아래 버튼을 눌러 주세요.</p>
<a class="b" id="go" href="#">📱 문자 앱 열기</a><pre id="pv"></pre></div>
<script>(function(){var p=new URLSearchParams(location.hash.slice(1));var to=(p.get('to')||'').replace(/[^0-9,;+]/g,''),body=p.get('body')||'';
try{history.replaceState(null,'',location.pathname)}catch(e){}
var ios=/iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent);
var u='sms:'+to+(body?(ios?'&':'?')+'body='+encodeURIComponent(body):'');
document.getElementById('go').href=u;document.getElementById('pv').textContent=body;
if(!to&&!body){document.getElementById('t').textContent='보낼 내용이 없어요';return}
document.getElementById('t').textContent=(to?to.replace(/^(\d{3})(\d{3,4})(\d{4})$/,'$1-$2-$3'):'')+' 에게 문자';
setTimeout(function(){location.href=u},150);})();</script>
</body></html>
